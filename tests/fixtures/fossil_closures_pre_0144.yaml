  "note": "Reuters (press, colour only) reports Engie's statement: 'market conditions for UK coal plant have deteriorated rapidly in recent years, as a result of a continued fall in power prices on the back of a commodity market decline, and increases in carbon costs'. The Engie primary statement was not retrieved, so per the brief the reason is 'other' with the actual date. DUKES 5.11 changed list gives 448 MW; the DUKES 2016 edition lists Rugeley at 1006 MW (GAP: capacity discrepancy). FLAG: with Engie's primary statement this would likely be 'mixed' or 'net_zero_policy' (~1 GW). s24 closure test (spec §15.4 item 2; work/s24-closure-test/margins.md): margin in fossil Britain without carbon, before filters: 2013 £+56m, 2014 £+14m, 2015 £+3m. After FGD+SCR (required to run past June 2020, s23a convention): 2015 £-46m. Positive in the year before closure (and in all three years), with the station's own TNUoS load factors and the higher of the two possible zone tariffs (16/18): by Richard's rule (spec §15.4 item 2) the closure was caused by carbon costs, so reason net_zero_policy and it keeps running in fossil Britain. The margin is thin (£3m on £57m revenue) and is not robust to small input changes. It was in the IED Transitional National Plan (Defra TNP Annex B), so like the other kept TNP stations it pays for FGD+SCR after June 2020 (s23a convention, fitment not documented); with that cost on 2015 terms the margin would be negative, so its long-run survival in fossil Britain is doubtful. Carbon cause: Reuters report of Engie's statement (press); the Engie primary statement still not retrieved. Capacity 448 MW per DUKES 5.11 (editions 1006 MW, GAP). PARENT FIX 11 Oct (Richard, spec §15.4 item 3): reason set to mixed: carbon costs caused the 2016 closure, but the pollution-law deadline would have closed it in fossil Britain; with FGD+SCR it loses money (2015 £-46m), so in fossil Britain it runs until the pollution-law deadline (30 Jun 2020) and then closes, rather than paying for filters that do not pay (air_pollution limit, spec §15.3 item 2).",
